# Fast checks on every push and pull request. No KiCad is installed here, so this covers only the parts of
# Copper that do not drive KiCad: the MCP protocol layer, the KiCad version/compatibility logic (against a fake
# kicad-cli), the token-budget unit tests, the npm launcher, the manifests and the installer scripts.
# Everything that edits schematics or boards runs against real KiCad images in kicad-matrix.yml.
#
# STATUS: written before the repository was public; it has not run on GitHub Actions yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      COPPER_NO_UPDATE_CHECK: "1"
      COPPER_TEST_NO_REPLAY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pillow
      - name: Isolated Copper and KiCad config folders
        run: |
          echo "COPPER_HOME=$RUNNER_TEMP/copper-home" >> "$GITHUB_ENV"
          echo "KICAD_CONFIG_HOME=$RUNNER_TEMP/kicad-config" >> "$GITHUB_ENV"
      - name: MCP protocol (stdio server, no KiCad)
        run: python tests/test_protocol.py
      - name: KiCad compatibility logic (fake kicad-cli)
        run: python tests/test_compat.py
      - name: Token budgets (unit tests only)
        run: python tests/test_tokens.py
      - name: Schematic style rules (the KiCad tests skip)
        run: python tests/test_sch_style.py

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifests are valid JSON and agree on the version
        run: |
          python - <<'PY'
          import json, re, pathlib
          v = re.search(r'__version__ = "([^"]+)"', pathlib.Path("src/copper_kicad/__init__.py").read_text()).group(1)
          files = ["server.json", "mcpb/manifest.json", "npm/package.json", "plugin/.claude-plugin/plugin.json",
                   "plugin/.codex-plugin/plugin.json", "plugin/.mcp.json", ".claude-plugin/marketplace.json",
                   ".agents/plugins/marketplace.json"]
          for f in files:
              json.loads(pathlib.Path(f).read_text(encoding="utf-8"))
          assert json.loads(pathlib.Path("npm/package.json").read_text())["version"] == v
          assert json.loads(pathlib.Path("server.json").read_text())["version"] == v
          print("manifests ok", v)
          PY
      - name: Installer scripts parse
        run: bash -n installer/install.sh
      - name: npm launcher unit tests
        working-directory: npm
        run: npm test
      - name: npm package packs and finds a Python
        working-directory: npm
        run: |
          node scripts/vendor.js
          npm pack --dry-run
          node bin/copper-kicad.js --launcher-info
          node bin/copper-kicad.js --version
