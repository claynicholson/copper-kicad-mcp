# KiCad compatibility matrix for Copper.
#
# STATUS: runs on GitHub Actions since the repository went public. The first runs found Linux-only bugs (a
# read-only file was replaced anyway, Claude Desktop seeded in the wrong place in demo mode) and that KiCad 10.0.8
# re-saved the complex_hierarchy demo in the 10.0 format; the KiCad 9 design the format tests need now lives in
# tests/data/demo-v9. KiCad 10.0.8 (the kicad/kicad:10.0 image) and 9.0.9 are checked on real binaries here.
#
# The tests run as the image's own user (kicad), not root: root can write read-only files and folders, which
# would hide exactly the bugs the read-only tests are there to catch.
#
# The fast no-KiCad checks are in ci.yml.
name: kicad-matrix

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: KiCad point releases land without a Copper commit

permissions:
  contents: read

jobs:
  pure:
    # No KiCad: version parsing, install selection, update check, ERC scale, capability gating against
    # tests/data/fake_kicad_cli.py. Tests that need a real KiCad report SKIP.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pillow
      - run: python tests/test_compat.py
      - run: python tests/test_protocol.py

  kicad:
    # The official KiCad images (Debian based; pcbnew is importable from the system python3).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "10.0"        # newest 10.0.x: the supported target
            required: true
          - tag: "10.0.6"      # the release with the ERC x100 report bug and the old zone filler
            required: true
          - tag: "9.0"         # view/verify only: `copper doctor` must say so and every edit must be refused
            required: false
    continue-on-error: ${{ !matrix.required }}
    container:
      image: kicad/kicad:${{ matrix.tag }}
      options: --user root
    env:
      KICAD_CONFIG_HOME: /tmp/kicad-config
      COPPER_HOME: /tmp/copper-home
      COPPER_NO_UPDATE_CHECK: "1"
    steps:
      # checkout runs as root: the mounted workspace belongs to the runner's uid, not to the image's user
      - uses: actions/checkout@v4
      - name: Pillow is in the image
        run: python3 -c "import PIL; print('pillow', PIL.__version__)"
      - name: A copy of the checkout owned by the image's user
        # HOME is set explicitly below: Actions injects HOME=/github/home, which belongs to root.
        # Nothing may run kicad-cli as root before this: it would create /tmp/kicad-config/<series> owned by root,
        # and the tests (as kicad) could not seed the global library tables there.
        run: |
          id kicad
          cp -a "$GITHUB_WORKSPACE" /tmp/src
          chown -R kicad:kicad /tmp/src
          install -d -o kicad -g kicad /tmp/kicad-config /tmp/copper-home /tmp/home
      - run: runuser -u kicad -- env HOME=/tmp/home kicad-cli version
      - name: Compatibility suite
        working-directory: /tmp/src
        run: runuser -u kicad -- env HOME=/tmp/home python3 tests/test_compat.py
      - name: Compatibility table
        if: ${{ !cancelled() }}
        working-directory: /tmp/src
        run: runuser -u kicad -- env HOME=/tmp/home PYTHONPATH=src python3 -m copper_kicad doctor --json --fast --offline || true
      - name: Full suites (KiCad 10 only)
        # runs even when the compatibility suite failed, so one failure never hides the others
        if: ${{ !cancelled() && matrix.tag != '9.0' }}
        working-directory: /tmp/src
        run: |
          for t in protocol schematic verify pcb guided_route focus parts distribution; do
            echo "::group::test_$t"
            runuser -u kicad -- env HOME=/tmp/home python3 tests/test_$t.py || echo "test_$t failed" >> /tmp/failed
            echo "::endgroup::"
          done
          if [ -f /tmp/failed ]; then cat /tmp/failed; exit 1; fi
      - name: Record the kicad-cli command tree
        if: always()
        working-directory: /tmp/src
        run: |
          runuser -u kicad -- env HOME=/tmp/home PYTHONPATH=src python3 - <<'PY'
          import json
          from copper_kicad.kicad import compat, env
          k = env.kicad(); c = compat.caps(k); c.count()
          new = {cmd: v["flags"] for cmd, v in sorted(c.d["help"].items())}
          old = {cmd: v["flags"] for cmd, v in json.load(open("tests/data/cli-10.0.json"))["help"].items()}
          for cmd in sorted(set(new) | set(old)):
              a, b = set(old.get(cmd, [])), set(new.get(cmd, []))
              if a != b:
                  print(cmd or "(root)", "removed:", sorted(a - b), "added:", sorted(b - a))
          print("KiCad", k.full_version, "learned formats", compat.learned_stamps(k))
          PY
